<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#00f5ff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MermaidMuse - Diagram Studio</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mouse+Memoirs&family=Sniglet:wght@400;800&family=Comic+Neue:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Chewy&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Comic Neue', 'sans-serif'],
              headline: ['Mouse Memoirs', 'cursive'],
              title: ['Sniglet', 'cursive'],
              paragraph: ['Comic Neue', 'sans-serif'],
              caption: ['Kalam', 'cursive'],
              banner: ['Chewy', 'cursive'],
              mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
            },
            colors: {
              'brand-green-light': '#D6F2D5',
              'brand-green-dark': '#4CAF50',
              'brand-yellow': '#FFD700',
              'brand-pink': '#FFA7A7',
              'brand-blue': '#4A90E2',
              'brand-magenta': '#E83E8C',
              'brand-cream': '#FCFBF5',
            },
            backgroundImage: {
              'dotted-paper': 'radial-gradient(#CBD5E1 1.5px, transparent 1.5px)',
            },
            backgroundSize: {
              dots: '24px 24px',
            },
          },
        },
      };
    </script>
    <style>
      /* Custom sketchy border class */
      .border-sketch {
        border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
        border: 2px solid #2d2d2d;
        box-shadow: 2px 2px 0 0 rgba(0, 0, 0, 0.1);
        transition: all 0.2s ease;
      }
      .border-sketch:hover {
        box-shadow: 3px 3px 0 0 rgba(0, 0, 0, 0.15);
        transform: translateY(-1px);
      }
      .border-sketch:active {
        box-shadow: 1px 1px 0 0 rgba(0, 0, 0, 0.1);
        transform: translateY(1px);
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
    </style>
  </head>
  <body class="bg-brand-cream text-gray-800 antialiased h-screen overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
