name = "diagram-maker"
main = "src/workers/index.ts"
compatibility_date = "2024-01-15"

workers_dev = true

[env.development]
name = "diagram-maker-dev"

[env.development.vars]
OPENAPI_MODEL = "gpt-4o"
OPENAPI_BASE_URL = "https://api.openai.com/v1"

[env.production]
name = "diagram-maker-prod"

[env.production.vars]
OPENAPI_MODEL = "gpt-4o"
OPENAPI_BASE_URL = "https://api.openai.com/v1"
